<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-50 via-slate-50 to-indigo-100/50 py-12 px-4 sm:px-6 lg:px-8 font-sans">
  <p-toast />

  <div class="max-w-md w-full space-y-8 bg-white p-8 sm:p-10 rounded-2xl border border-indigo-50/50 shadow-premium-lg transition-all duration-300 hover:shadow-2xl">
    <!-- Header -->
    <div class="text-center">
      <div class="mx-auto w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-secondary to-brand-primary flex items-center justify-center shadow-md mb-4">
        <span class="text-white font-bold text-2xl tracking-wider">TF</span>
      </div>
      <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight text-center">Recuperar contraseña</h2>
      <p class="mt-2 text-sm text-slate-500 text-center">Ingresa tu correo y te enviaremos un código de recuperación</p>
    </div>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="enviar()" class="mt-8 space-y-6">
      <div class="space-y-4">
        <!-- Correo -->
        <div class="flex flex-col gap-1.5">
          <label for="correo" class="text-sm font-semibold text-slate-700">Correo electrónico</label>
          <div class="flex rounded-xl shadow-sm border border-slate-200 overflow-hidden focus-within:border-brand-primary focus-within:ring-2 focus-within:ring-brand-primary/20 transition-all">
            <span class="inline-flex items-center px-3.5 bg-slate-50 border-r border-slate-200 text-slate-400">
              <i class="pi pi-envelope"></i>
            </span>
            <input
              type="email"
              id="correo"
              pInputText
              formControlName="correo"
              placeholder="correo@ejemplo.com"
              class="block w-full border-0 px-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:ring-0 focus:outline-none"
              [class.border-red-500]="form.get('correo')?.invalid && form.get('correo')?.touched"
            />
          </div>
          @if (form.get('correo')?.invalid && form.get('correo')?.touched) {
            <small class="text-red-500 text-xs mt-1">Ingrese un correo válido.</small>
          }
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex flex-col sm:flex-row gap-3 pt-2">
        <button
          type="button"
          routerLink="/auth/login"
          class="flex-1 px-5 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 font-semibold text-sm transition-all duration-200 cursor-pointer flex items-center justify-center gap-2"
        >
          <i class="pi pi-arrow-left"></i>
          <span>Volver</span>
        </button>

        <button
          type="submit"
          [disabled]="form.invalid || cargando()"
          class="flex-1 px-5 py-2.5 rounded-xl bg-brand-primary hover:bg-brand-primary-hover disabled:bg-slate-200 text-white font-semibold text-sm transition-all duration-200 cursor-pointer flex items-center justify-center gap-2 shadow-md shadow-brand-primary/10 disabled:shadow-none"
        >
          @if (cargando()) {
            <i class="pi pi-spin pi-spinner"></i>
          } @else {
            <i class="pi pi-send"></i>
          }
          <span>Enviar código</span>
        </button>
      </div>
    </form>
  </div>
</div>
